on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

name: Live SIDRA API

permissions:
  contents: read

concurrency:
  group: sidrar-live-api
  cancel-in-progress: false

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NOT_CRAN: "true"
      SIDRAR_RUN_LIVE_TESTS: "true"
      SIDRAR_LIVE_PAUSE_SECONDS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Run live API smoke tests
        id: live-tests
        run: |
          options(sidrar.timeout = 30, sidrar.retries = 2L)
          testthat::test_local(
            filter = "live-api",
            reporter = "summary",
            stop_on_failure = TRUE
          )
        shell: Rscript {0}

      - name: Report live API result
        if: always()
        env:
          LIVE_OUTCOME: ${{ steps.live-tests.outcome }}
        run: |
          printf '%s\n' \
            '## Live SIDRA API' \
            '' \
            "- Result: \`$LIVE_OUTCOME\`" \
            "- Run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" \
            '- Client limits: 30 seconds per attempt; 2 attempts.' \
            >> "$GITHUB_STEP_SUMMARY"
